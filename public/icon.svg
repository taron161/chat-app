<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.1" stroke="#00ffff" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  
  <!-- Chat bubble -->
  <g filter="url(#glowStrong)">
    <rect x="86" y="126" width="340" height="240" rx="30" fill="none" stroke="url(#chatGrad)" stroke-width="8"/>
  </g>
  
  <!-- Bubble tail -->
  <path d="M 146 366 L 106 426 L 176 366 Z" fill="url(#chatGrad)" filter="url(#glow)"/>
  
  <!-- Avatar circle 1 -->
  <g filter="url(#glow)">
    <circle cx="156" cy="196" r="35" fill="#a855f7"/>
  </g>
  <text x="156" y="206" font-family="Arial" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">T</text>
  
  <!-- Avatar circle 2 -->
  <g filter="url(#glow)">
    <circle cx="156" cy="286" r="35" fill="#00ffff"/>
  </g>
  <text x="156" y="296" font-family="Arial" font-size="32" fill="#000000" text-anchor="middle" font-weight="bold">N</text>
  
  <!-- Message bubbles -->
  <rect x="206" y="171" width="170" height="50" rx="15" fill="#1a1a2e" stroke="#a855f7" stroke-width="3" opacity="0.9"/>
  <rect x="206" y="261" width="130" height="50" rx="15" fill="#1a1a2e" stroke="#00ffff" stroke-width="3" opacity="0.9"/>
  
  <!-- Dots in messages -->
  <circle cx="226" cy="196" r="5" fill="#a855f7"/>
  <circle cx="246" cy="196" r="5" fill="#a855f7"/>
  <circle cx="266" cy="196" r="5" fill="#a855f7"/>
  <circle cx="226" cy="286" r="5" fill="#00ffff"/>
  <circle cx="246" cy="286" r="5" fill="#00ffff"/>
  
  <!-- Title text -->
  <text x="256" y="90" font-family="Arial" font-size="40" fill="url(#chatGrad)" text-anchor="middle" font-weight="bold" filter="url(#glow)">CHAT</text>
  
  <!-- Corner accents -->
  <g stroke="url(#chatGrad)" stroke-width="4" filter="url(#glow)">
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="472" y1="40" x2="432" y2="40"/>
    <line x1="472" y1="40" x2="472" y2="80"/>
    <line x1="40" y1="472" x2="80" y2="472"/>
    <line x1="40" y1="472" x2="40" y2="432"/>
    <line x1="472" y1="472" x2="432" y2="472"/>
    <line x1="472" y1="472" x2="472" y2="432"/>
  </g>
</svg>